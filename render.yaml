services:
  # FastAPI Backend
  - type: web
    name: qds-siem-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: qds-siem-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: qds-siem-db
          property: connectionString

databases:
  # Render Managed PostgreSQL Database
  - name: qds-siem-db
    databaseName: qds_siem
    user: postgres
    plan: free
    region: oregon
